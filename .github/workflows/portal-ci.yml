name: STAYCUT portal checks

on:
  push:
    branches: [codex/staycut-v2-design]
    paths: ["portal/**", "api/**", "server/**", "server-tests/**", "supabase/**", "package.json", "package-lock.json", "vercel.json", ".github/workflows/portal-ci.yml"]
  pull_request:
    types: [ready_for_review]
    paths: ["portal/**", "api/**", "server/**", "server-tests/**", "supabase/**", "package.json", "package-lock.json", "vercel.json", ".github/workflows/portal-ci.yml"]

permissions:
  contents: read

concurrency:
  group: staycut-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and static build
        run: |
          npm test
          npm run test:server
          npm run build
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser flow and responsive captures
        run: npm run test:browser
      - name: Authenticated customer flow with isolated fixtures
        run: npm run test:auth-browser
      - name: Operator upload, dashboard and customer access with isolated fixtures
        run: npm run test:operator-browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staycut-browser-evidence
          path: portal/test-results/
          retention-days: 7
          if-no-files-found: warn

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: staycut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: staycut_test
    steps:
      - uses: actions/checkout@v4
      - name: Database authorization regression tests
        run: bash supabase/tests/run.sh
