name: STAYCUT portal checks

on:
  push:
    branches: [codex/staycut-v2-design]
    paths: ["portal/**", "package.json", ".github/workflows/portal-ci.yml"]
  pull_request:
    types: [ready_for_review]
    paths: ["portal/**", "package.json", ".github/workflows/portal-ci.yml"]

permissions:
  contents: read

concurrency:
  group: staycut-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and static build
        run: |
          npm test
          npm run build
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser flow and responsive captures
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staycut-browser-evidence
          path: portal/test-results/
          retention-days: 7
          if-no-files-found: warn
